name: CI

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, test, compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          # Cache writes need actions:write, which this workflow does not grant.
          enable-cache: false

      - name: Sync dependencies from lockfile
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check src/douyin_danmu tests tools

      - name: Unit tests
        run: uv run pytest

      - name: Byte-compile
        run: uv run python -m compileall -q -f -x '/(\.venv|\.git)/' .
