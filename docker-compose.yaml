services:
  app:
    # 本地构建时取消下面 build 注释，并将 image 改为 douyin-live-recorder:latest
    image: ihmily/douyin-live-recorder:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    environment:
      - TERM=xterm-256color
    tty: true
    stdin_open: true
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./backup_config:/app/backup_config
      - ./downloads:/app/downloads
    restart: always